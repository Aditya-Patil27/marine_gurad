version: '3.8'

services:
  # Note: When using Supabase, you don't need local PostgreSQL
  # Uncomment below only for local development without Supabase
  
  # postgres:
  #   image: postgis/postgis:15-3.3
  #   container_name: blueguard_postgres
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-blueguard}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blueguard_secret}
  #     POSTGRES_DB: ${POSTGRES_DB:-blueguard_db}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U blueguard"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  redis:
    image: redis:7-alpine
    container_name: blueguard_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blueguard_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-blueguard}:${POSTGRES_PASSWORD:-blueguard_secret}@postgres:5432/${POSTGRES_DB:-blueguard_db}
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
    volumes:
      - ./backend:/app
      - model_weights:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blueguard_celery
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-blueguard}:${POSTGRES_PASSWORD:-blueguard_secret}@postgres:5432/${POSTGRES_DB:-blueguard_db}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - model_weights:/app/models
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blueguard_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  model_weights:
